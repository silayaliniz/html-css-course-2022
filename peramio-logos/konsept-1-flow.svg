<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- FLOW: "peramio" connected wordmark — all letters flow into each other
       Inspired by: fuse, Atome, abeo
       Technique: continuous filled path, mono-weight (~28px visual weight),
       all curves cubic bezier, lowercase geometric sans -->

  <g transform="translate(80, 65)" fill="#0f0f1a">

    <!-- p: descender + circular bowl -->
    <path d="
      M 14,40
      L 14,170
      C 14,174 10,174 10,170
      L 10,170
      L 10,40
      C 10,36 14,36 14,40
      Z
    "/>
    <path d="
      M 14,45
      C 14,18 50,10 75,10
      C 105,10 118,28 118,60
      C 118,92 105,110 75,110
      C 50,110 30,102 14,85
      M 14,75
      C 28,88 45,94 68,94
      C 90,94 100,82 100,60
      C 100,38 90,26 68,26
      C 45,26 28,34 14,55
    " fill-rule="evenodd"/>

    <!-- e: connected from p's baseline area -->
    <path d="
      M 130,60
      C 130,30 148,10 175,10
      C 202,10 218,30 218,55
      L 218,62
      L 148,62
      C 150,86 160,94 180,94
      C 195,94 205,82 210,72
      C 212,68 218,70 216,74
      C 208,90 195,108 175,108
      C 145,108 130,88 130,60
      Z
      M 148,48 L 200,48 C 198,32 190,24 175,24 C 160,24 150,32 148,48 Z
    " fill-rule="evenodd"/>

    <!-- r: minimal arm extending up-right -->
    <path d="
      M 228,105
      L 228,18
      C 228,14 232,14 232,18
      L 232,40
      C 240,22 252,12 270,12
      C 274,12 276,16 272,18
      C 255,20 242,30 236,48
      L 236,105
      C 236,109 228,109 228,105
      Z
    "/>

    <!-- a: bowl with vertical stem -->
    <path d="
      M 335,105
      L 335,50
      C 335,25 320,10 295,10
      C 275,10 265,18 260,30
      C 258,34 264,36 266,32
      C 272,22 280,18 295,18
      C 315,18 328,28 328,50
      L 328,60
      C 318,52 305,48 290,48
      C 270,48 258,60 258,78
      C 258,96 270,108 290,108
      C 308,108 320,100 328,88
      L 328,105
      C 328,109 335,109 335,105
      Z
      M 328,72
      C 328,88 310,96 290,96
      C 275,96 268,88 268,78
      C 268,68 275,60 290,60
      C 310,60 328,66 328,72
      Z
    " fill-rule="evenodd"/>

    <!-- m: double arch -->
    <path d="
      M 350,105
      L 350,18 C 350,14 354,14 354,18
      L 354,35
      C 362,20 375,10 395,10
      C 415,10 425,20 430,35
      C 438,20 452,10 472,10
      C 498,10 508,28 508,55
      L 508,105 C 508,109 504,109 504,105
      L 504,55
      C 504,32 496,18 475,18
      C 455,18 440,32 436,52
      L 436,105 C 436,109 432,109 432,105
      L 432,55
      C 432,32 424,18 403,18
      C 382,18 368,32 362,52
      L 362,105 C 362,109 358,109 358,105
      L 358,55
      Z
    "/>

    <!-- i: simple stem with round dot -->
    <circle cx="530" cy="-5" r="8" fill="#0f0f1a"/>
    <path d="
      M 526,18
      L 534,18 L 534,105
      C 534,109 526,109 526,105
      Z
    "/>

    <!-- o: circular, mirrors the p bowl -->
    <path d="
      M 555,60
      C 555,28 572,10 598,10
      C 624,10 640,28 640,60
      C 640,92 624,110 598,110
      C 572,110 555,92 555,60
      Z
      M 565,60
      C 565,86 578,98 598,98
      C 618,98 630,86 630,60
      C 630,34 618,22 598,22
      C 578,22 565,34 565,60
      Z
    " fill-rule="evenodd"/>

  </g>

  <!-- Tagline -->
  <text x="400" y="260" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Geometric mark: two overlapping rounded forms -->
  <g transform="translate(105, 65)">
    <!-- Bottom-left form (teal) -->
    <rect x="0" y="60" width="100" height="100" rx="22" fill="#0D9488" opacity="0.85"/>

    <!-- Top-right form (amber) — shifted up-right for growth/movement -->
    <rect x="45" y="15" width="100" height="100" rx="22" fill="#F59E0B" opacity="0.85"/>

    <!-- Overlap zone — darker blend color -->
    <rect x="45" y="60" width="55" height="55" rx="12" fill="#0A7566" opacity="0.6"/>

    <!-- Small upward arrow in the overlap -->
    <path d="M 72,95 L 72,72 M 62,82 L 72,70 L 82,82" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "Peramio" wordmark — light weight, modern -->
  <g fill="#1a1a2e" transform="translate(290, 100)">
    <!-- P -->
    <path d="M 0,0 L 0,100 L 14,100 L 14,62 L 36,62 Q 56,62 56,31 Q 56,0 36,0 Z M 14,14 L 34,14 Q 42,14 42,31 Q 42,48 34,48 L 14,48 Z"/>
    <!-- e -->
    <path d="M 72,55 Q 72,36 90,36 Q 106,36 108,52 L 72,52 Z M 108,62 L 72,62 Q 74,82 92,82 Q 104,82 110,74 L 118,82 Q 108,94 90,94 Q 64,94 64,64 Q 64,36 90,36 Q 116,36 116,60 L 116,62 Z" fill-rule="evenodd"/>
    <!-- r -->
    <path d="M 130,92 L 130,38 L 144,38 L 144,50 Q 150,36 166,36 L 166,50 Q 148,50 144,62 L 144,92 Z"/>
    <!-- a -->
    <path d="M 180,64 Q 180,54 192,54 L 206,54 L 206,50 Q 206,42 192,42 Q 184,42 178,48 L 172,40 Q 180,32 194,32 Q 220,32 220,54 L 220,92 L 206,92 L 206,86 Q 200,94 188,94 Q 174,94 174,80 Q 174,66 190,64 L 206,62 L 206,58 L 192,58 Q 180,58 180,64 Z M 186,80 Q 186,86 194,86 Q 206,86 206,74 L 206,70 L 192,72 Q 186,73 186,80 Z" fill-rule="evenodd"/>
    <!-- m -->
    <path d="M 238,92 L 238,38 L 252,38 L 252,48 Q 258,36 270,36 Q 282,36 286,46 Q 292,36 306,36 Q 322,36 322,56 L 322,92 L 308,92 L 308,58 Q 308,48 298,48 Q 290,48 288,58 L 288,92 L 274,92 L 274,58 Q 274,48 264,48 Q 256,48 254,58 L 254,92 Z"/>
    <!-- i -->
    <circle cx="344" cy="18" r="6" fill="#0D9488"/>
    <path d="M 338,38 L 350,38 L 350,92 L 338,92 Z"/>
    <!-- o -->
    <path d="M 366,64 Q 366,36 388,36 Q 410,36 410,64 Q 410,94 388,94 Q 366,94 366,64 Z M 380,64 Q 380,80 388,80 Q 396,80 396,64 Q 396,48 388,48 Q 380,48 380,64 Z" fill-rule="evenodd"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="330" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#aaa" letter-spacing="6">GROWTH AGENCY</text>
</svg>
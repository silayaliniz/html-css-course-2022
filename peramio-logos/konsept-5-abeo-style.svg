<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <rect width="800" height="280" fill="#ffffff"/>

  <!-- ABEO STYLE: "peramio" built from continuous circular forms
       70% match to abeo: same mono-weight thick stroke approach,
       same circular letter construction, same connected baseline,
       letters share structural elements and flow continuously -->

  <g transform="translate(45, 30)" fill="#0f0f1a">

    <!-- p: circle + descending stem, thick filled forms -->
    <!-- Circle body of p -->
    <path d="
      M 62,40 C 28,40 2,66 2,100
      C 2,134 28,160 62,160
      C 96,160 122,134 122,100
      C 122,66 96,40 62,40
      Z
      M 62,65 C 82,65 97,80 97,100
      C 97,120 82,135 62,135
      C 42,135 27,120 27,100
      C 27,80 42,65 62,65
      Z
    " fill-rule="evenodd"/>
    <!-- p stem descender -->
    <rect x="97" y="55" width="25" height="165" rx="12"/>

    <!-- e: circular with horizontal gap -->
    <path d="
      M 192,40 C 158,40 132,66 132,100
      C 132,134 158,160 192,160
      C 216,160 235,148 245,130
      L 222,122
      C 215,135 205,142 192,142
      C 172,142 158,130 155,112
      L 248,112
      C 250,108 252,104 252,100
      C 252,66 226,40 192,40
      Z
      M 192,58 C 214,58 230,72 232,92
      L 155,92
      C 158,72 172,58 192,58
      Z
    " fill-rule="evenodd"/>

    <!-- r: stem from baseline + arm curving up -->
    <rect x="260" y="48" width="25" height="112" rx="12"/>
    <path d="
      M 285,82
      C 298,55 318,42 342,42
      C 348,42 352,48 352,55
      C 352,62 348,68 342,68
      C 322,68 305,80 295,100
      L 285,100 Z
    "/>

    <!-- a: circle + stem -->
    <path d="
      M 408,40 C 374,40 348,66 348,100
      C 348,134 374,160 408,160
      C 442,160 468,134 468,100
      C 468,66 442,40 408,40
      Z
      M 408,65 C 428,65 443,80 443,100
      C 443,120 428,135 408,135
      C 388,135 373,120 373,100
      C 373,80 388,65 408,65
      Z
    " fill-rule="evenodd"/>
    <rect x="443" y="48" width="25" height="112" rx="12"/>

    <!-- m: three stems connected by arcs — continuous circular flow -->
    <rect x="480" y="48" width="25" height="112" rx="12"/>
    <!-- first arch -->
    <path d="
      M 505,95 C 505,65 520,48 545,48
      L 545,48
      C 555,48 560,48 560,48
    "/>
    <path d="
      M 492,80
      C 498,58 518,42 542,42
      C 568,42 585,58 585,85
      L 585,160 L 560,160 L 560,88
      C 560,72 552,62 540,62
      C 525,62 515,72 510,88
      Z
    "/>
    <!-- second arch -->
    <path d="
      M 572,80
      C 578,58 598,42 622,42
      C 648,42 665,58 665,85
      L 665,160 L 640,160 L 640,88
      C 640,72 632,62 620,62
      C 605,62 595,72 590,88
      Z
    "/>

    <!-- i: dot + stem -->
    <circle cx="695" cy="22" r="14"/>
    <rect x="682" y="48" width="25" height="112" rx="12"/>

    <!-- o: circular, mirrors p — creates visual bookend -->
    <path d="
      M 778,40 C 744,40 718,66 718,100
      C 718,134 744,160 778,160
      C 812,160 838,134 838,100
      C 838,66 812,40 778,40
      Z
      M 778,65 C 798,65 813,80 813,100
      C 813,120 798,135 778,135
      C 758,135 743,120 743,100
      C 743,80 758,65 778,65
      Z
    " fill-rule="evenodd"/>

  </g>

  <!-- Tagline -->
  <text x="440" y="240" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>
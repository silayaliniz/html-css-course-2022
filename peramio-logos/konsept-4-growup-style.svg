<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#2b2b8c"/>

  <!-- GROW UP STYLE: "pera" on top, "mio" below — stacked layout
       70% match to grow up: same thick rounded bubble letters,
       same playful stacked layout, same soft organic connections,
       same bold filled forms, pink on blue palette -->

  <g fill="#f5b8d0">

    <!-- TOP ROW: "pera" -->
    <g transform="translate(85, 40)">

      <!-- p: bubble rounded, descender goes down -->
      <path d="
        M 0,45 L 0,195
        C 0,210 20,210 20,195
        L 20,148
        C 32,162 50,170 72,170
        C 110,170 135,142 135,105
        C 135,68 110,40 72,40
        C 50,40 32,52 20,68
        L 20,45 C 20,30 0,30 0,45 Z
        M 20,105 C 20,80 38,65 65,65
        C 92,65 108,80 108,105
        C 108,130 92,145 65,145
        C 38,145 20,130 20,105 Z
      " fill-rule="evenodd"/>

      <!-- e: rounded with bar -->
      <path d="
        M 148,105 C 148,65 170,40 200,40
        C 230,40 250,65 250,100 L 250,110
        L 182,110 C 184,135 195,148 212,148
        C 225,148 232,138 238,125
        C 242,118 252,122 250,130
        C 242,155 228,170 205,170
        C 170,170 148,142 148,105 Z
        M 182,88 L 222,88
        C 220,72 212,60 200,60
        C 188,60 182,72 182,88 Z
      " fill-rule="evenodd"/>

      <!-- r: thick stem + arm -->
      <path d="
        M 262,165 L 262,48 C 262,35 282,35 282,48
        L 282,68 C 290,52 305,40 328,40
        C 335,40 338,52 332,58
        C 314,62 298,75 290,95
        L 290,165 C 290,178 262,178 262,165 Z
      "/>

      <!-- a: rounded bowl -->
      <path d="
        M 395,165 C 395,178 375,178 375,165
        L 375,148 C 365,162 348,172 325,172
        C 305,172 290,158 290,140
        C 290,120 308,108 335,108
        C 352,108 368,114 375,122
        L 375,95 C 375,75 362,62 340,62
        C 325,62 315,70 308,82
        C 304,88 295,84 298,78
        C 308,55 325,40 348,40
        C 382,40 395,58 395,88 Z
        M 375,140 C 374,150 355,158 338,158
        C 322,158 314,148 314,138
        C 314,128 322,120 338,120
        C 355,120 372,128 375,140 Z
      " fill-rule="evenodd"/>
    </g>

    <!-- BOTTOM ROW: "mio" — centered under "pera" -->
    <g transform="translate(130, 200)">

      <!-- m: double arch bubble -->
      <path d="
        M 0,130 L 0,12 C 0,0 20,0 20,12
        L 20,28 C 28,12 42,2 60,2
        C 80,2 90,12 95,28
        C 104,12 120,2 140,2
        C 168,2 180,22 180,55
        L 180,130 C 180,142 160,142 160,130
        L 160,58 C 160,38 152,25 138,25
        C 122,25 110,38 106,55
        L 106,130 C 106,142 86,142 86,130
        L 86,58 C 86,38 78,25 64,25
        C 48,25 38,38 32,55
        L 32,130 C 32,142 12,142 12,130 Z
      "/>

      <!-- i: dot + stem -->
      <circle cx="210" cy="-18" r="15"/>
      <path d="
        M 198,12 C 198,0 222,0 222,12
        L 222,130 C 222,142 198,142 198,130 Z
      "/>

      <!-- o: perfect circle, fat -->
      <path d="
        M 245,72 C 245,32 268,2 300,2
        C 332,2 355,32 355,72
        C 355,112 332,142 300,142
        C 268,142 245,112 245,72 Z
        M 270,72 C 270,100 282,120 300,120
        C 318,120 330,100 330,72
        C 330,44 318,24 300,24
        C 282,24 270,44 270,72 Z
      " fill-rule="evenodd"/>
    </g>
  </g>

  <!-- Subtle circle decoration in background like grow up -->
  <circle cx="480" cy="100" r="180" fill="none" stroke="#3535a0" stroke-width="1.5" opacity="0.3"/>
  <circle cx="120" cy="320" r="120" fill="none" stroke="#3535a0" stroke-width="1" opacity="0.2"/>
</svg>
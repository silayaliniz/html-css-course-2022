<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- "PERAMIO" bold wordmark with hidden arrow in negative space between r-a -->
  <g fill="#111111" transform="translate(95, 110)">
    <!-- P -->
    <path d="M 0,0 L 0,160 L 28,160 L 28,100 L 52,100 Q 82,100 82,50 Q 82,0 52,0 Z M 28,26 L 48,26 Q 56,26 56,50 Q 56,74 48,74 L 28,74 Z"/>

    <!-- E -->
    <path d="M 100,0 L 100,160 L 162,160 L 162,134 L 128,134 L 128,94 L 156,94 L 156,68 L 128,68 L 128,26 L 162,26 L 162,0 Z"/>

    <!-- R with angled leg -->
    <path d="M 180,0 L 180,160 L 208,160 L 208,104 L 224,104 L 244,160 L 274,160 L 250,98 Q 266,88 266,56 Q 266,0 232,0 Z M 208,26 L 230,26 Q 240,26 240,56 Q 240,78 230,78 L 208,78 Z"/>

    <!-- A with flat apex — negative space arrow hidden here -->
    <!-- The triangular counter of A + gap between R leg creates upward arrow reading -->
    <path d="M 278,160 L 310,0 L 344,0 L 376,160 L 348,160 L 342,130 L 312,130 L 306,160 Z M 318,106 L 336,106 L 327,52 Z"/>

    <!-- M -->
    <path d="M 392,0 L 418,80 L 444,0 L 472,0 L 472,160 L 448,160 L 448,60 L 426,130 L 410,130 L 388,60 L 388,160 L 364,160 L 364,0 Z" fill-rule="evenodd"/>

    <!-- I -->
    <path d="M 490,0 L 518,0 L 518,160 L 490,160 Z"/>

    <!-- O -->
    <path d="M 536,80 Q 536,0 574,0 Q 612,0 612,80 Q 612,160 574,160 Q 536,160 536,80 Z M 564,80 Q 564,130 574,130 Q 584,130 584,80 Q 584,30 574,30 Q 564,30 564,80 Z" fill-rule="evenodd"/>
  </g>

  <!-- Hidden arrow highlight — subtle accent showing the arrow between R-A -->
  <polygon points="373,140 383,110 393,140" fill="#2563EB" opacity="0.0"/>
  <!-- The arrow is in the negative space — no fill needed, viewer discovers it -->

  <!-- Accent line -->
  <line x1="95" y1="290" x2="707" y2="290" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

  <!-- Tagline -->
  <text x="400" y="330" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#888" letter-spacing="6">GROWTH AGENCY</text>
</svg>
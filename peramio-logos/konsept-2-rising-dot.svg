<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Wordmark: "Peramio" with the i dot replaced by a rising accent circle -->
  <text x="400" y="170" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="80" font-weight="500" fill="#1c1c28" letter-spacing="4">Peram</text>

  <!-- "i" stem only (no dot) -->
  <text x="603" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="80" font-weight="500" fill="#1c1c28" letter-spacing="4">ı</text>

  <!-- Rising dot — shifted upward from normal i-dot position, accent color -->
  <circle cx="609" cy="72" r="8" fill="#4F46E5"/>

  <!-- "o" after i -->
  <text x="632" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="80" font-weight="500" fill="#1c1c28" letter-spacing="4">o</text>

  <!-- Tagline -->
  <text x="400" y="220" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#bbb" letter-spacing="5">GROWTH AGENCY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1F8E"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Dual Arc symbol: two concentric growth arcs + vertical stem = abstract P -->
  <g transform="translate(130, 45)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="14" height="210" rx="7" fill="#3B1F8E"/>

    <!-- Inner arc (smaller growth) -->
    <path d="M 14,35 C 70,35 100,55 100,105 C 100,155 70,175 14,175"
          fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Outer arc (larger growth — scaling up) -->
    <path d="M 14,5 C 105,5 150,40 150,105 C 150,170 105,205 14,205"
          fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Wordmark -->
  <text x="345" y="180" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="300" fill="#1a1a2e" letter-spacing="5">Peramio</text>

  <!-- Tagline -->
  <text x="345" y="218" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#bbb" letter-spacing="5">GROWTH AGENCY</text>
</svg>
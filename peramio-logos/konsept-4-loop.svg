<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- LOOP: "peramio" rounded geometric, letters connected with loops
       Inspired by: abeo, grow up
       e-r connection forms organic loop, o is open (infinity feel)
       Bold filled, mono-weight, playful but professional -->

  <g transform="translate(65, 55)" fill="#0f0f1a">

    <!-- p: round bowl + descender -->
    <path d="
      M 10,50
      L 10,195
      C 10,200 22,200 22,195
      L 22,130
      C 32,142 48,150 68,150
      C 100,150 120,125 120,90
      C 120,55 100,30 68,30
      C 48,30 32,38 22,50
      L 22,42
      C 22,38 10,38 10,42
      Z
      M 22,90
      C 22,62 42,45 68,45
      C 94,45 108,62 108,90
      C 108,118 94,135 68,135
      C 42,135 22,118 22,90
      Z
    " fill-rule="evenodd"/>

    <!-- e: with right side flowing into r -->
    <path d="
      M 135,90
      C 135,55 155,30 185,30
      C 215,30 230,55 230,82
      L 230,90
      L 155,90
      C 157,115 170,130 190,130
      C 200,130 208,125 215,115
      L 215,90
      L 230,90
      C 230,125 215,150 185,150
      C 155,150 135,125 135,90
      Z
      M 155,78 L 218,78
      C 215,58 205,45 185,45
      C 168,45 158,58 155,78
      Z
    " fill-rule="evenodd"/>

    <!-- r: connected from e, arm curves up -->
    <path d="
      M 235,145 L 235,42
      C 235,38 247,38 247,42
      L 247,60
      C 255,42 270,30 292,30
      C 296,30 298,42 294,44
      C 272,46 258,60 250,82
      L 250,145
      C 250,149 235,149 235,145
      Z
    "/>

    <!-- a -->
    <path d="
      M 360,145 L 360,82
      C 360,52 342,30 312,30
      C 295,30 282,38 276,52
      C 274,56 282,60 284,56
      C 290,44 300,38 315,38
      C 338,38 348,52 348,78
      L 348,88
      C 338,78 324,72 308,72
      C 288,72 274,85 274,105
      C 274,125 288,140 308,140
      C 326,140 340,130 348,118
      L 348,145
      C 348,149 360,149 360,145
      Z
      M 348,100
      C 346,118 328,128 310,128
      C 295,128 286,118 286,105
      C 286,92 295,84 310,84
      C 328,84 346,90 348,100
      Z
    " fill-rule="evenodd"/>

    <!-- m: double hump -->
    <path d="
      M 378,145 L 378,42 C 378,38 390,38 390,42
      L 390,55
      C 398,40 412,30 432,30
      C 452,30 462,40 466,55
      C 474,40 490,30 510,30
      C 538,30 548,48 548,78
      L 548,145 C 548,149 536,149 536,145
      L 536,78
      C 536,55 528,42 512,42
      C 495,42 482,55 478,72
      L 478,145 C 478,149 466,149 466,145
      L 466,78
      C 466,55 458,42 442,42
      C 425,42 412,55 395,72
      L 395,145 C 395,149 383,149 383,145
      Z
    "/>

    <!-- i with dot -->
    <circle cx="572" cy="15" r="9"/>
    <path d="M 566,42 L 578,42 L 578,145 C 578,149 566,149 566,145 Z"/>

    <!-- o: open circle (gap at top-right = infinity/growth feel) -->
    <path d="
      M 598,90
      C 598,55 618,30 648,30
      C 678,30 698,55 698,90
      C 698,125 678,150 648,150
      C 618,150 598,125 598,90
      Z
      M 610,90
      C 610,118 625,138 648,138
      C 671,138 686,118 686,90
      C 686,62 671,42 648,42
      C 625,42 610,62 610,90
      Z
    " fill-rule="evenodd"/>
    <!-- Open gap at top-right of o -->
    <rect x="668" y="35" width="18" height="20" rx="4" fill="#ffffff"/>

  </g>

  <!-- Tagline -->
  <text x="420" y="265" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>
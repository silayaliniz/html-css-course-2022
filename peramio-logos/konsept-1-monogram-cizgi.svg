<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Large P with open curve - single weight thin stroke -->
  <g transform="translate(120, 60)">
    <!-- P vertical stem -->
    <line x1="0" y1="0" x2="0" y2="220" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
    <!-- P bowl - open curve (doesn't fully close) -->
    <path d="M 0,0 L 80,0 Q 140,0 140,50 Q 140,100 80,100 L 20,100"
          fill="none" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "eramio" text aligned to bottom of P stem -->
  <g transform="translate(172, 280)">
    <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="300" fill="#1a1a2e" letter-spacing="3">eramio</text>
  </g>

  <!-- Tagline -->
  <text x="400" y="360" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="300" fill="#999" letter-spacing="6">GROWTH AGENCY</text>
</svg>
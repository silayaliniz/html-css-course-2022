<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Custom lettering "peramio" all lowercase with ligatures -->
  <g transform="translate(100, 120)">

    <!-- p -->
    <g transform="translate(0, 0)">
      <line x1="12" y1="-10" x2="12" y2="80" stroke="#2b2b40" stroke-width="5" stroke-linecap="round"/>
      <path d="M 12,0 Q 12,-15 30,-15 L 40,-15 Q 58,-15 58,5 Q 58,25 40,25 L 12,25"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- e -->
    <g transform="translate(70, 0)">
      <path d="M 8,5 L 45,5 Q 48,5 48,0 Q 48,-15 30,-15 Q 12,-15 8,0 Q 4,15 8,25 Q 14,30 30,28"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- r-a ligature: r flows into a -->
    <g transform="translate(130, 0)">
      <!-- r stem -->
      <line x1="12" y1="-15" x2="12" y2="25" stroke="#2b2b40" stroke-width="5" stroke-linecap="round"/>
      <!-- r shoulder flowing into a -->
      <path d="M 12,-8 Q 12,-15 25,-15 Q 38,-15 42,-8 Q 48,-15 60,-15 Q 78,-15 78,0 L 78,25"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- a bowl -->
      <path d="M 78,15 Q 78,28 62,28 Q 46,28 46,15 Q 46,5 62,5 Q 78,5 78,10"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- m with extended middle leg -->
    <g transform="translate(230, 0)">
      <line x1="10" y1="-15" x2="10" y2="25" stroke="#2b2b40" stroke-width="5" stroke-linecap="round"/>
      <path d="M 10,-8 Q 10,-15 28,-15 Q 40,-15 40,0 L 40,25"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 40,-8 Q 40,-15 58,-15 Q 70,-15 70,0 L 70,25"
            fill="none" stroke="#2b2b40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Middle leg slightly taller (growth hint) -->
      <line x1="40" y1="-15" x2="40" y2="28" stroke="#2b2b40" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- i -->
    <g transform="translate(315, 0)">
      <line x1="10" y1="-15" x2="10" y2="25" stroke="#2b2b40" stroke-width="5" stroke-linecap="round"/>
      <circle cx="10" cy="-28" r="4" fill="#e85d4a"/>
    </g>

    <!-- o -->
    <g transform="translate(345, 0)">
      <ellipse cx="25" cy="6" rx="22" ry="22" fill="none" stroke="#2b2b40" stroke-width="5"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="400" y="300" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="300" fill="#999" letter-spacing="6">GROWTH AGENCY</text>
</svg>
      C 92,218 82,230 68,236
      C 56,240 48,234 48,224
      C 48,216 54,210 62,210
      C 70,210 74,216 72,224
    " fill="none" stroke="#6B2D7B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- e -->
    <path d="

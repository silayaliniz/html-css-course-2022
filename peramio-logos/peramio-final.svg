      C 504,158 484,176 454,176
      C 424,176 404,158 404,122 Z
      M 428,122 C 428,146 438,160 454,160
      C 470,160 480,146 480,122
      C 480,98 470,84 454,84
      C 438,84 428,98 428,122 Z
    " fill-rule="evenodd"/>
    <rect x="480" y="72" width="24" height="100"/>

    <!-- m -->
    <path d="
      M 516,72 L 540,72 L 540,92
      C 548,78 560,68 578,68
      C 596,68 604,78 608,92
      C 618,78 630,68 648,68
      C 674,68 684,86 684,114

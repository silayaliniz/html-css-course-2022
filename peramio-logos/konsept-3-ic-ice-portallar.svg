<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Nested portal symbol with negative space P -->
  <g transform="translate(180, 80)">
    <!-- Outer rounded rectangle -->
    <rect x="0" y="0" width="120" height="140" rx="20" ry="20"
          fill="none" stroke="#1a1a2e" stroke-width="4"/>

    <!-- Inner rounded rectangle - shifted slightly up-right for movement -->
    <rect x="30" y="10" width="75" height="90" rx="14" ry="14"
          fill="none" stroke="#1a1a2e" stroke-width="4"/>

    <!-- Negative space creates a P-like reading:
         The vertical left edge of outer rect = P stem
         The inner rect positioned at top-right = P bowl space -->
  </g>

  <!-- "Peramio" wordmark -->
  <g transform="translate(340, 185)">
    <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="400" fill="#1a1a2e" letter-spacing="3">Peramio</text>
  </g>

  <!-- Tagline -->
  <text x="400" y="340" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="300" fill="#999" letter-spacing="6">GROWTH AGENCY</text>
</svg>
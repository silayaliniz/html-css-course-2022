<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Window Mark: Squircle with negative-space P inside -->
  <g transform="translate(100, 35)">
    <!-- Squircle container (iOS-style superellipse approximation with cubic beziers) -->
    <path d="M 30,0 L 200,0
             C 220,0 230,10 230,30
             L 230,200
             C 230,220 220,230 200,230
             L 30,230
             C 10,230 0,220 0,200
             L 0,30
             C 0,10 10,0 30,0 Z"
          fill="#0D9488"/>

    <!-- Negative space P inside the squircle -->
    <path d="M 65,45 L 65,185 L 95,185 L 95,140 L 130,140
             C 165,140 180,125 180,100
             C 180,70 165,55 130,55 L 65,55 Z
             M 65,45 L 130,45
             C 175,45 192,65 192,100
             C 192,135 175,150 130,150 L 95,150 L 95,185 L 65,185 Z"
          fill="#ffffff" fill-rule="evenodd"/>

    <!-- Clean P cutout (simpler approach) -->
    <rect x="65" y="45" width="30" height="140" rx="2" fill="#ffffff"/>
    <path d="M 85,45 L 125,45
             C 162,45 180,62 180,95
             C 180,128 162,145 125,145 L 85,145 L 85,110 L 120,110
             C 138,110 148,104 148,95
             C 148,86 138,80 120,80 L 85,80 Z"
          fill="#ffffff" fill-rule="evenodd"/>
  </g>

  <!-- Wordmark -->
  <text x="385" y="178" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="60" font-weight="400" fill="#1a1a2e" letter-spacing="4">Peramio</text>

  <!-- Tagline -->
  <text x="385" y="215" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#bbb" letter-spacing="5">GROWTH AGENCY</text>
</svg>
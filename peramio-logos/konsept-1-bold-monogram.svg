<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Bold Monogram P with negative space growth arrow -->
  <g transform="translate(100, 55)">
    <!-- Thick geometric P -->
    <path d="M 40,0 L 40,290
             M 0,0 L 120,0 Q 175,0 175,55 L 175,85 Q 175,140 120,140 L 70,140"
          fill="none" stroke="#1a1a2e" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Negative space arrow inside P bowl (pointing up-right) -->
    <polygon points="115,42 140,28 140,56" fill="#FF6B54"/>
  </g>

  <!-- Wordmark "Peramio" -->
  <g transform="translate(310, 130)">
    <!-- P -->
    <path d="M 0,80 L 0,0 L 35,0 Q 55,0 55,20 L 55,30 Q 55,50 35,50 L 0,50" fill="none" stroke="#1a1a2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- e -->
    <path d="M 72,45 L 105,45 Q 108,30 90,26 Q 72,26 72,42 Q 72,58 90,58 Q 100,58 105,52" fill="none" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- r -->
    <path d="M 120,58 L 120,28 M 120,38 Q 125,26 140,26" fill="none" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- a -->
    <path d="M 170,58 L 170,28 Q 170,26 155,26 Q 142,26 142,38 Q 142,50 155,50 L 170,50 M 170,58 Q 170,62 160,62" fill="none" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- m -->
    <path d="M 185,58 L 185,28 Q 185,26 198,26 Q 208,26 208,36 L 208,58 M 208,36 Q 208,26 221,26 Q 231,26 231,36 L 231,58" fill="none" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- i -->
    <circle cx="245" cy="18" r="4" fill="#FF6B54"/>
    <path d="M 245,28 L 245,58" fill="none" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
    <!-- o -->
    <ellipse cx="268" cy="42" rx="15" ry="16" fill="none" stroke="#1a1a2e" stroke-width="6"/>
  </g>

  <!-- Tagline -->
  <path d="M 310,230 L 593,230" stroke="#FF6B54" stroke-width="1.5" opacity="0.4"/>
  <g transform="translate(310, 255)">
    <!-- G -->
    <path d="M 18,2 Q 8,2 4,8 Q 0,14 4,20 Q 8,26 18,26 L 18,16 L 12,16" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- R -->
    <path d="M 28,26 L 28,2 L 38,2 Q 44,2 44,8 Q 44,14 38,14 L 28,14 M 36,14 L 44,26" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- O -->
    <ellipse cx="58" cy="14" rx="8" ry="12" fill="none" stroke="#999" stroke-width="1.2"/>
    <!-- W -->
    <path d="M 72,2 L 76,26 L 82,12 L 88,26 L 92,2" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- T -->
    <path d="M 100,2 L 116,2 M 108,2 L 108,26" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
    <!-- H -->
    <path d="M 124,2 L 124,26 M 140,2 L 140,26 M 124,14 L 140,14" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>

    <!-- space -->

    <!-- A -->
    <path d="M 160,26 L 168,2 L 176,26 M 163,18 L 173,18" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- G -->
    <path d="M 196,2 Q 186,2 182,8 Q 178,14 182,20 Q 186,26 196,26 L 196,16 L 190,16" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- E -->
    <path d="M 214,2 L 204,2 L 204,26 L 214,26 M 204,14 L 212,14" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- N -->
    <path d="M 222,26 L 222,2 L 238,26 L 238,2" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- C -->
    <path d="M 258,4 Q 248,2 244,8 Q 240,14 244,20 Q 248,26 258,24" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Y -->
    <path d="M 266,2 L 274,14 L 282,2 M 274,14 L 274,26" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
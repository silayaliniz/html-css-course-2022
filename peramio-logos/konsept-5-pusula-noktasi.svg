<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- "Perami" text -->
  <text x="145" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="400" fill="#1a1a2e" letter-spacing="4">Perami</text>

  <!-- "o" replaced with compass diamond symbol -->
  <g transform="translate(545, 188)">
    <!-- Diamond/compass form - right-top corner slightly elongated -->
    <polygon points="20,0 40,18 20,36 0,18"
             fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Slightly extended top-right point for directional emphasis -->
    <line x1="20" y1="0" x2="26" y2="-6" stroke="#e85d4a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Small inner dot - compass center -->
    <circle cx="20" cy="18" r="3" fill="#e85d4a"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="310" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="300" fill="#999" letter-spacing="6">GROWTH AGENCY</text>
</svg>
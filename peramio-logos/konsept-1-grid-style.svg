<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- GRID STYLE: "PERAMIO" geometric uppercase, grid-based construction
       70% match to somma: same engineering precision, grid-aligned,
       modular letter construction, mono-weight, measured and clean -->

  <g transform="translate(52, 60)" fill="#0f0f1a">

    <!-- P: grid-based, 24px stroke width, 60px letter width -->
    <path d="
      M 0,0 L 0,180 L 24,180 L 24,110
      L 42,110 C 72,110 90,90 90,55
      C 90,20 72,0 42,0 Z
      M 24,24 L 40,24
      C 58,24 66,36 66,55
      C 66,74 58,86 40,86
      L 24,86 Z
    " fill-rule="evenodd"/>

    <!-- E -->
    <path d="
      M 104,0 L 104,180 L 172,180 L 172,156
      L 128,156 L 128,102 L 164,102 L 164,78
      L 128,78 L 128,24 L 172,24 L 172,0 Z
    "/>

    <!-- R -->
    <path d="
      M 186,0 L 186,180 L 210,180 L 210,114
      L 228,114 L 254,180 L 282,180 L 254,110
      C 270,100 280,82 280,58
      C 280,22 262,0 232,0 Z
      M 210,24 L 230,24
      C 248,24 256,36 256,58
      C 256,78 248,90 230,90
      L 210,90 Z
    " fill-rule="evenodd"/>

    <!-- A -->
    <path d="
      M 296,180 L 324,0 L 354,0 L 382,180
      L 358,180 L 352,146 L 326,146 L 320,180 Z
      M 330,124 L 348,124 L 339,62 Z
    " fill-rule="evenodd"/>

    <!-- M -->
    <path d="
      M 396,0 L 424,80 L 452,0 L 480,0
      L 480,180 L 456,180 L 456,52 L 432,126
      L 416,126 L 392,52 L 392,180 L 368,180 L 368,0 Z
    "/>

    <!-- I -->
    <rect x="496" y="0" width="24" height="180"/>

    <!-- O -->
    <path d="
      M 536,90 C 536,32 558,0 588,0
      C 618,0 640,32 640,90
      C 640,148 618,180 588,180
      C 558,180 536,148 536,90 Z
      M 560,90 C 560,136 570,156 588,156
      C 606,156 616,136 616,90
      C 616,44 606,24 588,24
      C 570,24 560,44 560,90 Z
    " fill-rule="evenodd"/>

  </g>

  <!-- Grid lines for architectural feel -->
  <line x1="52" y1="56" x2="692" y2="56" stroke="#e8e6e2" stroke-width="0.5"/>
  <line x1="52" y1="244" x2="692" y2="244" stroke="#e8e6e2" stroke-width="0.5"/>
  <line x1="48" y1="52" x2="48" y2="248" stroke="#e8e6e2" stroke-width="0.5"/>
  <line x1="696" y1="52" x2="696" y2="248" stroke="#e8e6e2" stroke-width="0.5"/>

  <text x="400" y="280" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>

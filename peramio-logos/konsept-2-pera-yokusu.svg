<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Peramio wordmark with ascending baseline -->
  <g transform="translate(130, 240)">
    <!-- Ascending baseline guide (invisible) -->
    <!-- Letters placed with slight upward progression -->

    <!-- Custom geometric sans-serif letterforms with ascending baseline -->
    <g transform="rotate(-3)">
      <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="500" fill="#2d2d3f" letter-spacing="4">Peram</text>

      <!-- "i" with chevron dot -->
      <g transform="translate(285, 0)">
        <!-- i stem -->
        <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="500" fill="#2d2d3f">i</text>
        <!-- Replace dot with upward chevron -->
        <rect x="5" y="-56" width="8" height="8" fill="#ffffff"/>
        <polyline points="3,-48 9,-58 15,-48" fill="none" stroke="#e85d4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(305, 0)">
        <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="500" fill="#2d2d3f">o</text>
      </g>
    </g>
  </g>

  <!-- Subtle ascending line under the text -->
  <line x1="125" y1="265" x2="570" y2="245" stroke="#e85d4a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Tagline -->
  <text x="400" y="330" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="300" fill="#999" letter-spacing="6">GROWTH AGENCY</text>
</svg>
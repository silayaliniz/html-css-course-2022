<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- ORGANIC P: Bold monogram inspired by Monvera's flowing M
       Large organic P with leaf/seed negative space in bowl
       Thick, confident, cubic bezier curves -->

  <g transform="translate(70, 20)" fill="#0f0f1a">

    <!-- P mark: thick stem + organic bowl with seed-shaped counter -->
    <path d="
      M 0,30
      C 0,12 8,0 28,0
      L 28,0
      C 28,0 90,0 120,0
      C 170,0 200,25 200,75
      C 200,130 170,160 120,160
      L 75,160
      L 75,260
      C 75,270 55,270 55,260
      L 55,160
      L 28,160
      C 8,160 0,148 0,130
      Z

      M 55,38
      L 55,122
      L 115,122
      C 148,122 165,108 165,75
      C 165,42 148,30 115,30
      L 55,38
      Z
    " fill-rule="evenodd"/>

    <!-- Seed/sprout shape in the counter (negative space detail) -->
    <path d="
      M 95,55
      C 85,55 80,62 80,75
      C 80,88 85,95 95,95
      C 108,95 118,92 125,82
      C 125,82 128,78 125,75
      C 118,62 108,55 95,55
      Z
    " fill="#ffffff"/>

    <!-- Small sprout line emerging from seed -->
    <path d="M 107,58 C 110,50 115,46 122,44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- "eramio" custom lettering next to P -->
  <g transform="translate(300, 95)" fill="#0f0f1a">

    <!-- e -->
    <path d="
      M 0,45 C 0,18 15,0 40,0 C 65,0 78,18 78,42 L 78,48 L 18,48
      C 20,68 30,76 45,76 C 58,76 66,68 70,58 L 78,62
      C 72,78 60,88 42,88 C 15,88 0,70 0,45 Z
      M 18,36 L 62,36 C 60,20 52,12 40,12 C 28,12 20,20 18,36 Z
    " fill-rule="evenodd"/>

    <!-- r -->
    <path d="
      M 92,85 L 92,5 L 108,5 L 108,22
      C 115,8 128,0 145,0 L 145,16
      C 125,16 112,28 108,45 L 108,85 Z
    "/>

    <!-- a -->
    <path d="
      M 210,85 L 210,38 C 210,14 195,0 170,0 C 152,0 140,8 135,22 L 148,28
      C 152,18 160,12 172,12 C 190,12 198,22 198,40 L 198,48
      C 190,40 178,36 164,36 C 145,36 132,48 132,65 C 132,82 145,92 164,92
      C 180,92 192,82 198,72 L 198,85 Z
      M 198,58 C 196,72 182,80 166,80 C 152,80 144,72 144,64
      C 144,56 152,48 166,48 C 182,48 196,54 198,58 Z
    " fill-rule="evenodd"/>

    <!-- m -->
    <path d="
      M 225,85 L 225,5 L 240,5 L 240,18
      C 248,6 260,0 278,0 C 295,0 305,8 310,20
      C 318,6 332,0 350,0 C 375,0 385,16 385,42 L 385,85 L 370,85
      L 370,44 C 370,24 362,12 345,12 C 328,12 316,24 312,40 L 312,85 L 298,85
      L 298,44 C 298,24 290,12 273,12 C 256,12 244,24 240,40 L 240,85 Z
    "/>

    <!-- i -->
    <circle cx="405" cy="-18" r="7" fill="#0f0f1a"/>
    <path d="M 398,5 L 412,5 L 412,85 L 398,85 Z"/>

    <!-- o -->
    <path d="
      M 430,45 C 430,18 448,0 472,0 C 496,0 514,18 514,45
      C 514,72 496,90 472,90 C 448,90 430,72 430,45 Z
      M 446,45 C 446,65 456,78 472,78 C 488,78 498,65 498,45
      C 498,25 488,12 472,12 C 456,12 446,25 446,45 Z
    " fill-rule="evenodd"/>
  </g>

  <!-- Tagline -->
  <text x="555" y="225" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>
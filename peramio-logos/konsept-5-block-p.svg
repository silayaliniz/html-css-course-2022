<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- BLOCK P: Geometric logomark — bold, architectural P
       Inspired by: Brand Up arrows, BJZ cube
       P built from two strong geometric forms: vertical block + angled bowl
       Bowl tilts slightly upward = growth direction
       Paired with condensed bold "PERAMIO" custom lettering -->

  <g transform="translate(70, 25)" fill="#0f0f1a">

    <!-- P stem: strong vertical block -->
    <path d="
      M 0,0 L 48,0 L 48,250 L 0,250 Z
    "/>

    <!-- P bowl: bold curved form, slightly tilted upward
         Using cubic beziers for smooth, confident curve -->
    <path d="
      M 48,20
      L 100,15
      C 160,8 195,35 195,85
      C 195,135 160,162 100,155
      L 48,150
      Z
      M 48,52
      L 95,48
      C 135,44 155,58 155,85
      C 155,112 135,126 95,122
      L 48,118
      Z
    " fill-rule="evenodd"/>

  </g>

  <!-- "PERAMIO" condensed bold custom lettering -->
  <g transform="translate(310, 55)" fill="#0f0f1a">

    <!-- P -->
    <path d="
      M 0,0 L 0,150 L 22,150 L 22,95 L 45,95
      C 68,95 82,78 82,48 C 82,18 68,0 45,0 Z
      M 22,20 L 42,20 C 55,20 62,30 62,48 C 62,66 55,75 42,75 L 22,75 Z
    " fill-rule="evenodd"/>

    <!-- E -->
    <path d="M 95,0 L 95,150 L 155,150 L 155,130 L 117,130 L 117,85 L 148,85 L 148,65 L 117,65 L 117,20 L 155,20 L 155,0 Z"/>

    <!-- R -->
    <path d="
      M 168,0 L 168,150 L 190,150 L 190,98 L 210,98 L 232,150 L 256,150
      L 232,95 C 246,86 254,70 254,48 C 254,18 238,0 212,0 Z
      M 190,20 L 208,20 C 225,20 234,30 234,48 C 234,66 225,76 208,76 L 190,76 Z
    " fill-rule="evenodd"/>

    <!-- A -->
    <path d="
      M 262,150 L 292,0 L 320,0 L 350,150 L 328,150 L 320,115 L 292,115 L 284,150 Z
      M 296,96 L 316,96 L 306,40 Z
    " fill-rule="evenodd"/>

    <!-- M -->
    <path d="M 360,0 L 388,75 L 416,0 L 442,0 L 442,150 L 422,150 L 422,45 L 398,112 L 378,112 L 354,45 L 354,150 L 334,150 L 334,0 Z"/>

    <!-- I -->
    <path d="M 455,0 L 477,0 L 477,150 L 455,150 Z"/>

    <!-- O -->
    <path d="
      M 490,75 C 490,25 508,0 535,0 C 562,0 580,25 580,75
      C 580,125 562,150 535,150 C 508,150 490,125 490,75 Z
      M 512,75 C 512,115 520,132 535,132 C 550,132 558,115 558,75
      C 558,35 550,18 535,18 C 520,18 512,35 512,75 Z
    " fill-rule="evenodd"/>

  </g>

  <!-- Tagline -->
  <text x="400" y="265" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#ccc" letter-spacing="5">GROWTH AGENCY</text>
</svg>
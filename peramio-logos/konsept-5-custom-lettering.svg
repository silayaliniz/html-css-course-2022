<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Light version -->
  <rect width="800" height="200" fill="#ffffff"/>

  <!-- "PERAMIO" custom lettering — bold, geometric, rounded corners -->
  <g fill="#111111" transform="translate(68, 40)">
    <!-- P — bowl is a perfect circle -->
    <path d="M 0,0 L 0,120 L 26,120 L 26,72 L 40,72 Q 72,72 72,36 Q 72,0 40,0 Z M 26,22 L 38,22 Q 48,22 48,36 Q 48,50 38,50 L 26,50 Z"/>

    <!-- E — clean geometric -->
    <path d="M 88,0 L 88,120 L 148,120 L 148,98 L 114,98 L 114,72 L 142,72 L 142,50 L 114,50 L 114,22 L 148,22 L 148,0 Z"/>

    <!-- R — angled leg, balanced -->
    <path d="M 164,0 L 164,120 L 190,120 L 190,78 L 204,78 L 224,120 L 254,120 L 230,74 Q 246,64 246,40 Q 246,0 212,0 Z M 190,22 L 210,22 Q 222,22 222,40 Q 222,56 210,56 L 190,56 Z"/>

    <!-- A — flat apex cut (modern/cesur) -->
    <path d="M 256,120 L 286,0 L 322,0 L 352,120 L 324,120 L 318,96 L 290,96 L 284,120 Z M 296,74 L 312,74 L 304,36 Z"/>

    <!-- M — strong, wide -->
    <path d="M 368,0 L 396,72 L 424,0 L 452,0 L 452,120 L 430,120 L 430,44 L 406,108 L 386,108 L 362,44 L 362,120 L 340,120 L 340,0 Z" fill-rule="evenodd"/>

    <!-- I — simple, bold -->
    <path d="M 468,0 L 494,0 L 494,120 L 468,120 Z"/>

    <!-- O — geometric circle-inspired -->
    <path d="M 510,60 Q 510,0 546,0 Q 582,0 582,60 Q 582,120 546,120 Q 510,120 510,60 Z M 536,60 Q 536,96 546,96 Q 556,96 556,60 Q 556,24 546,24 Q 536,24 536,60 Z" fill-rule="evenodd"/>
  </g>

  <!-- Accent dot after O -->
  <circle cx="658" cy="155" r="6" fill="#FF6B54"/>

  <!-- Tagline light version -->
  <text x="400" y="185" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#bbb" letter-spacing="6">GROWTH AGENCY</text>

  <!-- ===== DARK VERSION ===== -->
  <rect y="200" width="800" height="200" fill="#111111"/>

  <!-- Same lettering in white -->
  <g fill="#ffffff" transform="translate(68, 240)">
    <!-- P -->
    <path d="M 0,0 L 0,120 L 26,120 L 26,72 L 40,72 Q 72,72 72,36 Q 72,0 40,0 Z M 26,22 L 38,22 Q 48,22 48,36 Q 48,50 38,50 L 26,50 Z"/>
    <!-- E -->
    <path d="M 88,0 L 88,120 L 148,120 L 148,98 L 114,98 L 114,72 L 142,72 L 142,50 L 114,50 L 114,22 L 148,22 L 148,0 Z"/>
    <!-- R -->
    <path d="M 164,0 L 164,120 L 190,120 L 190,78 L 204,78 L 224,120 L 254,120 L 230,74 Q 246,64 246,40 Q 246,0 212,0 Z M 190,22 L 210,22 Q 222,22 222,40 Q 222,56 210,56 L 190,56 Z"/>
    <!-- A -->
    <path d="M 256,120 L 286,0 L 322,0 L 352,120 L 324,120 L 318,96 L 290,96 L 284,120 Z M 296,74 L 312,74 L 304,36 Z"/>
    <!-- M -->
    <path d="M 368,0 L 396,72 L 424,0 L 452,0 L 452,120 L 430,120 L 430,44 L 406,108 L 386,108 L 362,44 L 362,120 L 340,120 L 340,0 Z" fill-rule="evenodd"/>
    <!-- I -->
    <path d="M 468,0 L 494,0 L 494,120 L 468,120 Z"/>
    <!-- O -->
    <path d="M 510,60 Q 510,0 546,0 Q 582,0 582,60 Q 582,120 546,120 Q 510,120 510,60 Z M 536,60 Q 536,96 546,96 Q 556,96 556,60 Q 556,24 546,24 Q 536,24 536,60 Z" fill-rule="evenodd"/>
  </g>

  <!-- Accent dot dark version -->
  <circle cx="658" cy="355" r="6" fill="#FF6B54"/>

  <!-- Tagline dark version -->
  <text x="400" y="385" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#555" letter-spacing="6">GROWTH AGENCY</text>
</svg>
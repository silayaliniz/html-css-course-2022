<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Arrow P: P letterform where the stem becomes an upward arrow -->
  <g transform="translate(110, 30)">
    <!-- Arrow tip at top of stem -->
    <path d="M 22,0 L 44,35 L 33,35 L 33,35 Z" fill="#E8573A"/>
    <path d="M 22,0 L 0,35 L 11,35 L 11,35 Z" fill="#E8573A"/>
    <polygon points="22,0 0,38 11,38 11,35 22,12 33,35 33,38 44,38" fill="#E8573A"/>

    <!-- P stem (continues from arrow) -->
    <rect x="11" y="36" width="22" height="204" fill="#1a1a2e"/>

    <!-- P bowl — cubic bezier, filled, attached to stem -->
    <path d="M 33,55 L 80,55
             C 135,55 160,72 160,110
             C 160,148 135,165 80,165 L 33,165 L 33,135 L 75,135
             C 110,135 128,126 128,110
             C 128,94 110,85 75,85 L 33,85 Z"
          fill="#1a1a2e" fill-rule="evenodd"/>
  </g>

  <!-- Wordmark -->
  <text x="325" y="180" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="500" fill="#1a1a2e" letter-spacing="4">Peramio</text>

  <!-- Tagline -->
  <text x="325" y="218" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="400" fill="#bbb" letter-spacing="5">GROWTH AGENCY</text>
</svg>
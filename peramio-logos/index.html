<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peramio — Logo Konseptleri v4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f2f0ed;
      color: #0f0f1a;
      padding: 80px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 80px;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #999;
    }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-logo {
      padding: 48px 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-logo img {
      max-width: 100%;
      height: auto;
    }
    .card-meta {
      padding: 20px 32px;
      border-top: 1px solid #f0eeeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta h2 {
      font-size: 14px;
      font-weight: 500;
    }
    .card-meta span {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Peramio — v4</h1>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-logo"><img src="konsept-1-flow.svg" alt="Flow"></div>
      <div class="card-meta">
        <h2>01 — Flow</h2>
        <span>fuse + Atome ilhamı</span>
      </div>
    </div>

    <div class="card">
      <div class="card-logo"><img src="konsept-2-organic-p.svg" alt="Organic P"></div>
      <div class="card-meta">
        <h2>02 — Organic P</h2>
        <span>Monvera M ilhamı</span>
      </div>
    </div>

    <div class="card">
      <div class="card-logo"><img src="konsept-3-spark-letter.svg" alt="Spark Letter"></div>
      <div class="card-meta">
        <h2>03 — Spark Letter</h2>
        <span>spark. + negative SPACE ilhamı</span>
      </div>
    </div>

    <div class="card">
      <div class="card-logo"><img src="konsept-4-loop.svg" alt="Loop"></div>
      <div class="card-meta">
        <h2>04 — Loop</h2>
        <span>abeo + grow up ilhamı</span>
      </div>
    </div>

    <div class="card">
      <div class="card-logo"><img src="konsept-5-block-p.svg" alt="Block P"></div>
      <div class="card-meta">
        <h2>05 — Block P</h2>
        <span>Brand Up + BJZ ilhamı</span>
      </div>
    </div>
  </div>
</body>
</html>

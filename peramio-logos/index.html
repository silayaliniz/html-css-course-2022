<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peramio — Final Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f2f0ed;
      color: #0f0f1a;
      padding: 80px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 80px;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #999;
    }
    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-logo {
      padding: 48px 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-logo img {
      max-width: 100%;
      height: auto;
    }
    .card-meta {
      padding: 20px 32px;
      border-top: 1px solid #f0eeeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta h2 { font-size: 14px; font-weight: 500; }
    .card-meta span { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Peramio — Final Logo</h1>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-logo"><img src="peramio-final.svg" alt="Peramio Logo"></div>
      <div class="card-meta">
        <h2>Peramio Creative Design Agency</h2>
        <span>Grid-based geometric wordmark, purple</span>
      </div>
    </div>
  </div>
</body>
</html>

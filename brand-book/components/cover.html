<!-- @dsCard group="Brand Book" -->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peramio Brand Book - Cover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #F5F0E8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .cover {
    width: 800px;
    height: 1100px;
    background: #F5F0E8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .logo-svg-wrap {
    width: 560px;
    position: relative;
  }

  .grid-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 540px;
    height: 160px;
    pointer-events: none;
    z-index: 0;
  }

  .grid-overlay line {
    stroke: #B8A0C4;
    stroke-width: 0.5;
    opacity: 0.3;
  }

  .corner-star {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 20px;
    height: 20px;
    opacity: 0.5;
  }

  .brand-book-label {
    position: absolute;
    bottom: 60px;
    left: 60px;
    font-size: 11px;
    font-weight: 300;
    color: #6B2D7B;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .year-label {
    position: absolute;
    bottom: 40px;
    left: 60px;
    font-size: 11px;
    font-weight: 300;
    color: #6B2D7B;
    letter-spacing: 3px;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="cover">
    <!-- Construction Grid Lines -->
    <svg class="grid-overlay" viewBox="0 0 540 160">
      <line x1="20" y1="15" x2="520" y2="15"/>
      <line x1="20" y1="40" x2="520" y2="40"/>
      <line x1="20" y1="65" x2="520" y2="65"/>
      <line x1="20" y1="90" x2="520" y2="90"/>
      <line x1="20" y1="110" x2="520" y2="110"/>
      <line x1="20" y1="130" x2="520" y2="130"/>
      <line x1="20" y1="148" x2="520" y2="148"/>
      <line x1="50" y1="5" x2="50" y2="155"/>
      <line x1="110" y1="5" x2="110" y2="155"/>
      <line x1="165" y1="5" x2="165" y2="155"/>
      <line x1="215" y1="5" x2="215" y2="155"/>
      <line x1="270" y1="5" x2="270" y2="155"/>
      <line x1="335" y1="5" x2="335" y2="155"/>
      <line x1="395" y1="5" x2="395" y2="155"/>
      <line x1="435" y1="5" x2="435" y2="155"/>
      <line x1="500" y1="5" x2="500" y2="155"/>
    </svg>

    <div class="logo-svg-wrap">
      <svg viewBox="0 0 560 175" width="560" height="175" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="pDescClip">
            <rect x="0" y="0" width="560" height="120"/>
            <rect x="0" y="120" width="21" height="60"/>
            <rect x="47" y="120" width="560" height="60"/>
          </clipPath>
        </defs>

        <!-- Full peramio text with clipped p descender bottom -->
        <text x="18" y="115" font-family="'Poppins', sans-serif" font-weight="800" font-size="95"
              fill="#6B2D7B" letter-spacing="-1" clip-path="url(#pDescClip)">peramio</text>

        <!-- Swoosh descender for p -->
        <path d="M 33,108 L 33,138 C 33,150 26,154 16,151"
              stroke="#6B2D7B" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Dot above p -->
        <circle cx="33" cy="38" r="8.5" fill="#6B2D7B"/>

        <!-- Subtitle -->
        <text x="280" y="165" font-family="'Poppins', sans-serif" font-weight="300" font-size="13.5"
              fill="#6B2D7B" text-anchor="middle" letter-spacing="4.5">GROWTH AND CREATIVE AGENCY</text>
      </svg>
    </div>

    <!-- Corner star -->
    <svg class="corner-star" viewBox="0 0 20 20">
      <path d="M 10 0 L 12 8 L 20 10 L 12 12 L 10 20 L 8 12 L 0 10 L 8 8 Z" fill="#6B2D7B" opacity="0.6"/>
    </svg>

    <div class="brand-book-label">Brand Guidelines</div>
    <div class="year-label">2026</div>
  </div>
</body>
</html>

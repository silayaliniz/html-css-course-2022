<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peramio - Primary Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #F5F0E8;
    min-height: 100vh;
  }

  .page {
    width: 800px;
    min-height: 1100px;
    background: #F5F0E8;
    padding: 80px;
    margin: 0 auto;
    position: relative;
  }

  .page-number {
    position: absolute;
    top: 40px;
    right: 80px;
    font-size: 11px;
    font-weight: 300;
    color: #6B2D7B;
    opacity: 0.4;
    letter-spacing: 2px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #6B2D7B;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 8px;
  }

  .section-title {
    font-size: 42px;
    font-weight: 700;
    color: #6B2D7B;
    margin-bottom: 16px;
    line-height: 1.1;
  }

  .section-desc {
    font-size: 14px;
    font-weight: 300;
    color: #6B2D7B;
    line-height: 1.8;
    max-width: 480px;
    opacity: 0.7;
    margin-bottom: 60px;
  }

  .logo-display {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 70px 60px;
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
    box-shadow: 0 2px 20px rgba(107, 45, 123, 0.04);
  }

  .logo-dark {
    background: #2D1438;
  }

  .display-label {
    font-size: 11px;
    font-weight: 400;
    color: #6B2D7B;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 8px;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: #6B2D7B;
    opacity: 0.15;
    margin: 0 0 60px 0;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="page-number">02</div>
    <div class="section-label">01 — Logo</div>
    <div class="section-title">Primary Logo</div>
    <div class="divider"></div>
    <div class="section-desc">
      The Peramio logo is the cornerstone of our visual identity. The distinctive lowercase "p" with its swooping descender and characteristic dot represents creativity and forward motion.
    </div>

    <div class="display-label">Light Background</div>
    <div class="logo-display">
      <svg viewBox="0 0 480 150" width="420" height="130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="pClipL">
            <rect x="0" y="0" width="480" height="104"/>
            <rect x="0" y="104" width="18" height="60"/>
            <rect x="41" y="104" width="480" height="60"/>
          </clipPath>
        </defs>
        <text x="15" y="100" font-family="'Poppins', sans-serif" font-weight="800" font-size="82" fill="#6B2D7B" letter-spacing="-1" clip-path="url(#pClipL)">peramio</text>
        <path d="M 29,93 L 29,120 C 29,133 23,136 14,133" stroke="#6B2D7B" stroke-width="15.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="29" cy="30" r="7.5" fill="#6B2D7B"/>
        <text x="240" y="143" font-family="'Poppins', sans-serif" font-weight="300" font-size="12" fill="#6B2D7B" text-anchor="middle" letter-spacing="4">GROWTH AND CREATIVE AGENCY</text>
      </svg>
    </div>

    <div class="display-label">Dark Background</div>
    <div class="logo-display logo-dark">
      <svg viewBox="0 0 480 150" width="420" height="130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="pClipD">
            <rect x="0" y="0" width="480" height="104"/>
            <rect x="0" y="104" width="18" height="60"/>
            <rect x="41" y="104" width="480" height="60"/>
          </clipPath>
        </defs>
        <text x="15" y="100" font-family="'Poppins', sans-serif" font-weight="800" font-size="82" fill="#F5F0E8" letter-spacing="-1" clip-path="url(#pClipD)">peramio</text>
        <path d="M 29,93 L 29,120 C 29,133 23,136 14,133" stroke="#F5F0E8" stroke-width="15.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="29" cy="30" r="7.5" fill="#F5F0E8"/>
        <text x="240" y="143" font-family="'Poppins', sans-serif" font-weight="300" font-size="12" fill="#F5F0E8" text-anchor="middle" letter-spacing="4">GROWTH AND CREATIVE AGENCY</text>
      </svg>
    </div>
  </div>
</body>
</html>

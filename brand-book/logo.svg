<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 175" width="560" height="175">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;800&amp;display=swap');
    </style>
    <clipPath id="pDescClip">
      <rect x="0" y="0" width="560" height="120"/>
      <rect x="0" y="120" width="21" height="60"/>
      <rect x="47" y="120" width="560" height="60"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="560" height="175" fill="#F5F0E8"/>

  <!-- Construction Grid - Horizontal -->
  <line x1="10" y1="38" x2="550" y2="38" stroke="#B8A0C4" stroke-width="0.4" opacity="0.25"/>
  <line x1="10" y1="65" x2="550" y2="65" stroke="#B8A0C4" stroke-width="0.4" opacity="0.25"/>
  <line x1="10" y1="90" x2="550" y2="90" stroke="#B8A0C4" stroke-width="0.4" opacity="0.25"/>
  <line x1="10" y1="115" x2="550" y2="115" stroke="#B8A0C4" stroke-width="0.4" opacity="0.25"/>
  <line x1="10" y1="140" x2="550" y2="140" stroke="#B8A0C4" stroke-width="0.4" opacity="0.25"/>

  <!-- Construction Grid - Vertical -->
  <line x1="45" y1="30" x2="45" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="100" y1="30" x2="100" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="155" y1="30" x2="155" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="210" y1="30" x2="210" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="270" y1="30" x2="270" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="340" y1="30" x2="340" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="395" y1="30" x2="395" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="445" y1="30" x2="445" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>
  <line x1="510" y1="30" x2="510" y2="150" stroke="#B8A0C4" stroke-width="0.4" opacity="0.2"/>

  <!-- Logo text with clipped p descender -->
  <text x="18" y="115" font-family="'Poppins', sans-serif" font-weight="800" font-size="95"
        fill="#6B2D7B" letter-spacing="-1" clip-path="url(#pDescClip)">peramio</text>

  <!-- Swoosh descender -->
  <path d="M 33,108 L 33,138 C 33,150 26,154 16,151"
        stroke="#6B2D7B" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dot above p -->
  <circle cx="33" cy="38" r="8.5" fill="#6B2D7B"/>

  <!-- Subtitle -->
  <text x="280" y="165" font-family="'Poppins', sans-serif" font-weight="300" font-size="13.5"
        fill="#6B2D7B" text-anchor="middle" letter-spacing="4.5">GROWTH AND CREATIVE AGENCY</text>

  <!-- Four-pointed star -->
  <g transform="translate(530, 160)">
    <path d="M 0 -8 L 1.5 -1.5 L 8 0 L 1.5 1.5 L 0 8 L -1.5 1.5 L -8 0 L -1.5 -1.5 Z" fill="#6B2D7B" opacity="0.4"/>
  </g>
</svg>

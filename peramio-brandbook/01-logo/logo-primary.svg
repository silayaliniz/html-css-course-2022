<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <rect width="880" height="300" fill="#EDE9DF"/>

  <!-- Grid construction lines -->
  <g stroke="#C0B4C8" stroke-width="0.5" opacity="0.3">
    <line x1="30" y1="60" x2="850" y2="60"/>
    <line x1="30" y1="100" x2="850" y2="100"/>
    <line x1="30" y1="160" x2="850" y2="160"/>
    <line x1="30" y1="200" x2="850" y2="200"/>
    <line x1="30" y1="230" x2="850" y2="230"/>
    <line x1="68" y1="40" x2="68" y2="240"/>
    <line x1="178" y1="40" x2="178" y2="240"/>
    <line x1="280" y1="40" x2="280" y2="240"/>
    <line x1="340" y1="40" x2="340" y2="240"/>
    <line x1="450" y1="40" x2="450" y2="240"/>
    <line x1="560" y1="40" x2="560" y2="240"/>
    <line x1="680" y1="40" x2="680" y2="240"/>
    <line x1="718" y1="40" x2="718" y2="240"/>
    <line x1="828" y1="40" x2="828" y2="240"/>
  </g>

  <g fill="#5B2670">

    <!-- p: stem + circular bowl + descender with smooth curl -->
    <path d="
      M 56,60 L 80,60 L 80,78
      C 92,64 110,56 132,56
      C 166,56 188,80 188,118
      C 188,156 166,180 132,180
      C 114,180 96,172 84,158
      L 80,170 L 80,192
      C 80,198 78,204 74,210
      C 70,216 64,220 58,220
      C 50,220 44,214 46,206
      C 48,198 56,196 62,200
      C 66,203 66,208 62,212
      L 56,60 Z
      M 80,118
      C 80,92 100,74 132,74
      C 164,74 178,92 178,118
      C 178,144 164,162 132,162
      C 100,162 80,144 80,118 Z
    " fill-rule="evenodd"/>

    <!-- e: nearly closed circle + crossbar -->
    <path d="
      M 204,118 C 204,78 226,56 258,56
      C 290,56 308,78 308,112
      L 308,124 L 230,124
      C 232,150 246,164 266,164
      C 278,164 286,156 292,146
      L 300,154
      C 290,172 274,180 254,180
      C 222,180 204,158 204,118 Z
      M 230,108 L 288,108
      C 286,86 276,74 258,74
      C 240,74 232,86 230,108 Z
    " fill-rule="evenodd"/>

    <!-- r: short stem + small arm nub -->
    <path d="
      M 318,60 L 342,60 L 342,92
      C 348,80 358,70 372,66
      C 378,64 382,72 376,76
      C 364,80 354,90 350,102
      L 342,102 L 342,170 L 318,170 Z
    "/>

    <!-- a: circular bowl + right stem as single form -->
    <path d="
      M 388,118 C 388,78 410,56 442,56
      C 474,56 496,78 496,118
      C 496,158 474,180 442,180
      C 410,180 388,158 388,118 Z
      M 412,118 C 412,144 424,160 442,160
      C 460,160 472,144 472,118
      C 472,92 460,74 442,74
      C 424,74 412,92 412,118 Z
    " fill-rule="evenodd"/>
    <rect x="472" y="60" width="24" height="110"/>

    <!-- m: two round arches + three stems -->
    <path d="
      M 510,60 L 534,60 L 534,82
      C 544,66 556,56 574,56
      C 592,56 602,66 606,82
      C 618,66 632,56 650,56
      C 676,56 688,76 688,106
      L 688,170 L 664,170 L 664,108
      C 664,88 656,76 642,76
      C 628,76 618,88 614,102
      L 614,170 L 590,170 L 590,108
      C 590,88 582,76 568,76
      C 554,76 544,88 540,102
      L 534,102 L 534,170 L 510,170 Z
    "/>

    <!-- i: dot + stem -->
    <circle cx="718" cy="42" r="14"/>
    <rect x="706" y="60" width="24" height="110"/>

    <!-- o: full circle -->
    <path d="
      M 748,118 C 748,78 768,56 798,56
      C 828,56 848,78 848,118
      C 848,158 828,180 798,180
      C 768,180 748,158 748,118 Z
      M 772,118 C 772,144 782,160 798,160
      C 814,160 824,144 824,118
      C 824,92 814,74 798,74
      C 782,74 772,92 772,118 Z
    " fill-rule="evenodd"/>

  </g>

  <!-- Tagline -->
  <text x="440" y="256" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="10" font-weight="400" fill="#5B2670" letter-spacing="3.5" opacity="0.45">PERAMIO CREATIVE DESIGN</text>
  <text x="440" y="272" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="10" font-weight="400" fill="#5B2670" letter-spacing="3.5" opacity="0.45">AGENCY</text>
</svg>
